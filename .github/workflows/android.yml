name: Montar app Android (Meu Frete)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar pacotes
        run: npm install --no-audit --no-fund

      - name: Gerar projeto Android
        run: |
          mkdir -p www && cp index.html www/index.html
          npx cap add android
          npx cap sync android
          node patch-android.js

      - name: Montar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MeuFrete.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeuFrete-apk
          path: MeuFrete.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meu Frete Android v1.0.${{ github.run_number }}
          body: Instalador do app Meu Frete para Android (com rastreio em segundo plano).
          files: MeuFrete.apk
